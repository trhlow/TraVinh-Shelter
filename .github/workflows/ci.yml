name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-springboot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn test

      - name: Package
        run: mvn package

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Review dependencies in PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo --redact --exit-code 1 --verbose

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose
        env:
          POSTGRES_DB: travinh_realty
          POSTGRES_USER: travinh_app
          POSTGRES_PASSWORD: ci-only-postgres-password
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: docker compose config

      - name: Validate prod compose
        env:
          DB_URL: jdbc:postgresql://ci-only-host:25060/travinh_realty?sslmode=require
          DB_USERNAME: travinh_app
          DB_PASSWORD: ci-only-postgres-password
          DB_APP_USERNAME: travinh_app_runtime
          DB_APP_PASSWORD: ci-only-app-runtime-password
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
          CORS_ALLOWED_ORIGINS: https://example.com
          DOMAIN: example.com
        run: docker compose -f docker-compose.prod.yml config

  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-springboot
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/travinh-shelter-backend:latest

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/travinh-shelter-backend:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/travinh-shelter-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-react
          push: false
          load: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_USE_MOCK_API=false
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          tags: ghcr.io/${{ github.repository_owner }}/travinh-shelter-frontend:latest

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/travinh-shelter-frontend:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/travinh-shelter-frontend:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/travinh-shelter
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
